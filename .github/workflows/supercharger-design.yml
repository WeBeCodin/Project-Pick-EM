name: Supercharger Design Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright with dependencies
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: |
          npm run test:visual || echo "⚠️  Visual tests may need baseline updates"
        continue-on-error: true

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: test-results/**/*.png
          retention-days: 7

  design-review:
    name: Automated Design Review
    runs-on: ubuntu-latest
    needs: visual-regression
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download visual test results
        uses: actions/download-artifact@v4
        with:
          name: visual-test-results
          path: test-results/

      - name: Run automated design review
        id: design_review
        run: |
          npm run design-review || echo "⚠️  Design review completed with warnings"
          
          # Check if report was generated
          if [ -f "design-review-report.md" ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload design review report
        if: steps.design_review.outputs.report_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: design-review-report
          path: design-review-report.md
          retention-days: 30

      - name: Comment PR with design review
        if: steps.design_review.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Read the design review report
            let reportContent = '';
            try {
              reportContent = fs.readFileSync('design-review-report.md', 'utf8');
            } catch (error) {
              console.log('Could not read design review report');
              reportContent = '## 🎨 Automated Design Review\n\n⚠️ Report could not be generated. See workflow logs for details.';
            }
            
            // Find existing design review comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🎨 Automated Design Review')
            );
            
            const commentBody = `${reportContent}

---
<sub>🤖 This review was automatically generated by the Supercharger Design Review workflow. [View workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing design review comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new design review comment');
            }

      - name: Comment PR with fallback message
        if: steps.design_review.outputs.report_exists != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentBody = `## 🎨 Automated Design Review

⚠️ Design review could not be completed. This may be because:
- The application failed to start
- Visual tests did not run successfully
- No screenshots were captured

**Next Steps:**
1. Check the [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
2. Ensure the application builds and starts correctly
3. Verify visual test configuration

---
<sub>🤖 This is an automated message from the Supercharger Design Review workflow.</sub>`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

  accessibility-check:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: visual-regression
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility checks
        run: |
          echo "♿ Running accessibility audit (placeholder)"
          echo "TODO: Integrate axe-core or similar for automated a11y testing"
          echo "Consider: pa11y, lighthouse, axe-playwright"
        continue-on-error: true

  summary:
    name: Design Review Summary
    runs-on: ubuntu-latest
    needs: [visual-regression, design-review, accessibility-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "🎨 Design Review Pipeline Summary"
          echo "================================="
          echo "Visual Regression: ${{ needs.visual-regression.result }}"
          echo "Design Review: ${{ needs.design-review.result }}"
          echo "Accessibility: ${{ needs.accessibility-check.result }}"
          echo "================================="
          echo "✅ Design review pipeline completed"
          echo ""
          echo "📸 Screenshots and reports available as workflow artifacts"
